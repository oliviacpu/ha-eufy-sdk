# Fork-only (oliviacpu/ha-eufy-sdk): test main, set manifest.json's version to
# <upstream version>-oliviacpu.<YYYYMMDD>[.N], commit it, tag main oliviacpu-YYYY.MM.DD[.N] and create the
# GitHub Release HACS installs from. Run by fork-sync.yml after an upstream merge, or by hand after merging a
# fork change. See FORK.md.
name: Fork release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository != 'mega-yfue/ha-eufy-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_common.txt
            requirements_dev.txt
      - run: bash .github/fork/check.sh
      - run: bash .github/fork/release.sh
