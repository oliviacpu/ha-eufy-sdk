# Fork-only: daily, merge upstream's main into main when main doesn't have it, check, push and release.
# Anything that needs a person opens the upstream-sync issue instead. See FORK.md.
name: Fork sync

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository != 'mega-yfue/ha-eufy-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_common.txt
            requirements_dev.txt
      - id: merge
        run: bash .github/fork/sync.sh

  release:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/fork-release.yml
